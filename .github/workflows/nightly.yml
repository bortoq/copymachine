name: nightly
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
jobs:
  check-tower-long:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: tools/ci/tower-long.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-tower-long
          path: build/ci/check-tower-long.log
