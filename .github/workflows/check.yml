name: check
on:
  push:
  pull_request:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib clang
      - run: pip install ruff coverage
      - run: tools/ci/fast.sh
      - run: tools/ci/clean.sh
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        mode: [release, sanitizers]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: tools/ci/emulator.sh ${{ matrix.cc }} ${{ matrix.mode }}
  language:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: tools/ci/language.sh
      - uses: actions/upload-artifact@v7
        with:
          name: L0
          path: |
            language/build/L0.boot
            language/build/L0.sha256
