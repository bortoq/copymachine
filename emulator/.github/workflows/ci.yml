name: emulator
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        mode: [release, sanitizers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check both backends and mechanism controls
        env:
          CC: ${{ matrix.cc }}
          MODE: ${{ matrix.mode }}
        run: |
          set -eu
          export CFLAGS='-std=c11 -Wall -Wextra -Werror -pedantic -O2'
          if [ "$MODE" = sanitizers ]; then
            export CFLAGS='-std=c11 -Wall -Wextra -Werror -pedantic -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie'
            export ASAN_OPTIONS='detect_leaks=1:halt_on_error=1'
            export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          fi
          make check
          if [ "$MODE" = release ] && [ "$CC" = gcc ]; then make distcheck; fi
          make clean
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
