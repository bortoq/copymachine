name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.compiler }} / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [release, sanitizers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Declared dependency source snapshots
        env:
          VM1_URL: ${{ vars.VM1_SOURCE_URL }}
          VM1_SHA: ${{ vars.VM1_SOURCE_SHA256 }}
          COPYCODE_URL: ${{ vars.COPYCODE_SOURCE_URL }}
          COPYCODE_SHA: ${{ vars.COPYCODE_SOURCE_SHA256 }}
        run: |
          set -eu
          : "${VM1_URL:?Configure VM1_SOURCE_URL and VM1_SOURCE_SHA256}"
          : "${COPYCODE_URL:?Configure COPYCODE_SOURCE_URL and COPYCODE_SOURCE_SHA256}"
          curl --fail --location "$VM1_URL" --output /tmp/vm1-source.tar.gz
          curl --fail --location "$COPYCODE_URL" --output /tmp/copycode-source.tar.gz
          python3 -B tools/dependency_sources.py /tmp/vm1-source.tar.gz "$VM1_SHA" vendor/vm1
          python3 -B tools/dependency_sources.py /tmp/copycode-source.tar.gz "$COPYCODE_SHA" vendor/copycode
      - name: Toolchain versions
        run: |
          ${{ matrix.compiler }} --version
          python3 --version
          make --version
      - name: Build and check clean checkout
        env:
          CC: ${{ matrix.compiler }}
          MODE: ${{ matrix.mode }}
        run: |
          set -eu
          export CFLAGS='-std=c11 -Wall -Wextra -Werror -O3'
          if [ "$MODE" = sanitizers ]; then
            export CFLAGS='-std=c11 -Wall -Wextra -Werror -O1 -g -fno-omit-frame-pointer -fno-pie -fsanitize=address,undefined'
            export LDFLAGS='-no-pie -fsanitize=address,undefined'
            export SPACE_TEST_ASAN=1
            export ASAN_OPTIONS='detect_leaks=1:allocator_may_return_null=1:halt_on_error=1'
            export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          fi
          make check
          make check-legacy BIN=tmp/ci/space
          test ! -e space
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  source-release:
    name: Source archive and staged installation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Declared dependency source snapshots
        env:
          VM1_URL: ${{ vars.VM1_SOURCE_URL }}
          VM1_SHA: ${{ vars.VM1_SOURCE_SHA256 }}
          COPYCODE_URL: ${{ vars.COPYCODE_SOURCE_URL }}
          COPYCODE_SHA: ${{ vars.COPYCODE_SOURCE_SHA256 }}
        run: |
          set -eu
          : "${VM1_URL:?Configure VM1_SOURCE_URL and VM1_SOURCE_SHA256}"
          : "${COPYCODE_URL:?Configure COPYCODE_SOURCE_URL and COPYCODE_SOURCE_SHA256}"
          curl --fail --location "$VM1_URL" --output /tmp/vm1-source.tar.gz
          curl --fail --location "$COPYCODE_URL" --output /tmp/copycode-source.tar.gz
          python3 -B tools/dependency_sources.py /tmp/vm1-source.tar.gz "$VM1_SHA" vendor/vm1
          python3 -B tools/dependency_sources.py /tmp/copycode-source.tar.gz "$COPYCODE_SHA" vendor/copycode
      - name: Verify distributable source and installed executable
        run: make check-dist CC=gcc CFLAGS='-std=c11 -Wall -Wextra -Werror -O3'
